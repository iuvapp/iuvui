name: Cloudflare Deploy

on:
  workflow_call:
    inputs:
      deploy-sha:
        description: Exact commit SHA to build and deploy
        required: true
        type: string
      profile:
        description: develop uploads staging previews; production deploys live Workers
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy Workers to staging previews
    if: inputs.profile == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: Staging
    steps:
      - name: Reject invalid profile
        env:
          REQUESTED_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          if [[ "${REQUESTED_PROFILE}" != "develop" ]]; then
            echo "::error::Staging deploy requires profile=develop"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy-sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify deployment configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          set -euo pipefail
          missing=()
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            missing+=(CLOUDFLARE_ACCOUNT_ID)
          fi
          if [[ "${CLOUDFLARE_API_TOKEN_CONFIGURED}" != "true" ]]; then
            missing+=(CLOUDFLARE_API_TOKEN)
          fi
          if ((${#missing[@]})); then
            echo "::error::Missing required Cloudflare configuration: ${missing[*]}"
            exit 1
          fi

      - name: Deploy staging previews
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/ci-cloudflare-deploy.mjs develop

  deploy-production:
    name: Deploy Workers to production
    if: inputs.profile == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: Production
    steps:
      - name: Reject invalid profile
        env:
          REQUESTED_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          if [[ "${REQUESTED_PROFILE}" != "production" ]]; then
            echo "::error::Production deploy requires profile=production"
            exit 1
          fi

      - name: Verify deployment configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          set -euo pipefail
          missing=()
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            missing+=(CLOUDFLARE_ACCOUNT_ID)
          fi
          if [[ "${CLOUDFLARE_API_TOKEN_CONFIGURED}" != "true" ]]; then
            missing+=(CLOUDFLARE_API_TOKEN)
          fi
          if ((${#missing[@]})); then
            echo "::error::Missing required Cloudflare configuration: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy-sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Deploy production Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/ci-cloudflare-deploy.mjs production
