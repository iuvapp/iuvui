name: Upstream source check

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadcn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      - name: Compare pinned shadcn source with the default branch
        run: node scripts/check-upstream-provenance.mjs --remote
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
