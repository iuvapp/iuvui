name: CI

on:
  workflow_call:
    inputs:
      deploy-sha:
        description: Exact commit SHA to validate
        required: true
        type: string

concurrency:
  group: ci-${{ inputs.deploy-sha }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy-sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm language:check
      - run: pnpm format:check
      - run: pnpm release:check
      - run: pnpm registry:check
      - run: pnpm upstream:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack:check
      - run: pnpm consumer:check

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy-sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @iuvui/storybook exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: true
